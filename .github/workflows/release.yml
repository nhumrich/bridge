name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/blinklang/blink:0.36
    steps:
      - uses: actions/checkout@v4

      - name: Build binaries
        run: |
          mkdir -p dist
          blink build src/main.bl --release -T linux -o dist/br-linux-amd64
          blink build src/main.bl --release -T linux-arm64 -o dist/br-linux-arm64
          blink build src/main.bl --release -T macos -o dist/br-darwin-amd64
          blink build src/main.bl --release -T macos-arm64 -o dist/br-darwin-arm64

      - name: Checksums
        run: |
          cd dist
          rm -f br-*.c
          sha256sum br-* > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/br-*
            dist/checksums.txt

  publish-aur:
    needs: release
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          pacman -Sy --noconfirm --needed base-devel git openssh pacman-contrib

      - name: Derive version
        id: ver
        run: echo "pkgver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Fetch release checksums
        run: |
          curl -fsSL -o checksums.txt \
            "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/checksums.txt"
          echo "SHA_AMD64=$(awk '/br-linux-amd64$/{print $1}' checksums.txt)" >> "$GITHUB_ENV"
          echo "SHA_ARM64=$(awk '/br-linux-arm64$/{print $1}' checksums.txt)" >> "$GITHUB_ENV"

      - name: Configure SSH for AUR
        run: |
          mkdir -p /root/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > /root/.ssh/aur
          chmod 600 /root/.ssh/aur
          ssh-keyscan aur.archlinux.org >> /root/.ssh/known_hosts
          chmod 644 /root/.ssh/known_hosts
          printf 'Host aur.archlinux.org\n  IdentityFile /root/.ssh/aur\n  User aur\n' >> /root/.ssh/config

      - name: Clone AUR repo
        run: git clone ssh://aur@aur.archlinux.org/bridge-bin.git aur

      - name: Render PKGBUILD
        run: |
          sed -e "s/__PKGVER__/${{ steps.ver.outputs.pkgver }}/" \
              -e "s/__SHA256_AMD64__/${SHA_AMD64}/" \
              -e "s/__SHA256_ARM64__/${SHA_ARM64}/" \
              .github/aur/PKGBUILD.in > aur/PKGBUILD

      - name: Generate .SRCINFO
        working-directory: aur
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c 'makepkg --printsrcinfo > .SRCINFO'

      - name: Commit & push to AUR
        working-directory: aur
        run: |
          git config user.name "${{ secrets.AUR_USERNAME }}"
          git config user.email "nick@humrich.us"
          git add PKGBUILD .SRCINFO
          git commit -m "Release ${{ github.ref_name }}"
          git push origin HEAD:master
