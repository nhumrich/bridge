name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # Keep in sync with blink-version in blink.toml and the image tag in release.yml.
      image: ghcr.io/blinklang/blink:0.60.0
    steps:
      - uses: actions/checkout@v7

      - name: Check
        run: blink check src/main.bl

      - name: Build
        run: blink build src/main.bl --strict

      - name: Test
        run: blink test
